services:

  broker:
    image: redis:7-alpine
    container_name: paperless-redis
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_ARGS: "--save 300 1"
    restart: unless-stopped
    volumes:
      - ${INSTALL_DIR}/redis:/data
    networks:
      - paperless-net
    deploy:
      resources:
        limits:
          memory: 256M

  db:
    image: postgres:16-alpine
    container_name: paperless-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 45s
      interval: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${INSTALL_DIR}/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c effective_cache_size=384MB
      -c random_page_cost=1.1
    networks:
      - paperless-net
    deploy:
      resources:
        limits:
          memory: 512M

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.7
    container_name: paperless-gotenberg
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=.*"
    networks:
      - paperless-net
    deploy:
      resources:
        limits:
          memory: 512M

  tika:
    image: apache/tika:latest
    container_name: paperless-tika
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - paperless-net
    deploy:
      resources:
        limits:
          memory: 512M

  paperless:
    # v3 requires an explicit tag because v3 introduces breaking DB migrations
    # (see docs/migration-v3.md upstream). Pin to a version you have verified.
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_VERSION:-3.0.0}
    container_name: paperless-ngx
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      gotenberg:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${INSTALL_DIR}/data:/usr/src/paperless/data
      - ${INSTALL_DIR}/media:/usr/src/paperless/media
      - ${INSTALL_DIR}/export:/usr/src/paperless/export
      - ${INSTALL_DIR}/consume:/usr/src/paperless/consume
      - ${INSTALL_DIR}/scripts:/usr/src/paperless/scripts
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      # v3 no longer infers the engine from DBHOST presence; must be explicit.
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: ${POSTGRES_DB}
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIMEZONE}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_ALLOWED_HOSTS}
      PAPERLESS_CORS_ALLOWED_HOSTS: ${PAPERLESS_CORS_ALLOWED_HOSTS}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS}
      # OCR
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE}
      PAPERLESS_OCR_LANGUAGES: ${PAPERLESS_OCR_LANGUAGES}
      # v3 renamed OCR_MODE=skip to skip_noarchive and removed
      # OCR_SKIP_ARCHIVE_FILE — see docs/migration-v3.md.
      PAPERLESS_OCR_MODE: skip_noarchive
      PAPERLESS_OCR_CLEAN: none
      PAPERLESS_OCR_DPI: 300
      PAPERLESS_OCR_CACHING: "true"
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
      # ── AI / LLM (v3 native, optional) ─────────────────────
      # Configure via .env. Leave PAPERLESS_AI_ENABLED=false to disable.
      # For Gemini, use OpenAI-compat endpoint:
      #   PAPERLESS_AI_LLM_ENDPOINT=https://generativelanguage.googleapis.com/v1beta/openai/
      #   PAPERLESS_AI_LLM_MODEL=gemini-2.5-flash
      #   PAPERLESS_AI_LLM_EMBEDDING_MODEL=gemini-embedding-001
      PAPERLESS_AI_ENABLED: ${PAPERLESS_AI_ENABLED:-false}
      PAPERLESS_AI_LLM_BACKEND: ${PAPERLESS_AI_LLM_BACKEND:-}
      PAPERLESS_AI_LLM_MODEL: ${PAPERLESS_AI_LLM_MODEL:-}
      PAPERLESS_AI_LLM_API_KEY: ${PAPERLESS_AI_LLM_API_KEY:-}
      PAPERLESS_AI_LLM_ENDPOINT: ${PAPERLESS_AI_LLM_ENDPOINT:-}
      PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: ${PAPERLESS_AI_LLM_OUTPUT_LANGUAGE:-en}
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: ${PAPERLESS_AI_LLM_REQUEST_TIMEOUT:-60}
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ${PAPERLESS_AI_LLM_EMBEDDING_BACKEND:-}
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: ${PAPERLESS_AI_LLM_EMBEDDING_MODEL:-}
      PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: ${PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT:-}
      # Consumer
      PAPERLESS_CONSUMER_POLLING: 10
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "false"
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
      PAPERLESS_CONSUMER_RETRY_COUNT: 3
      # ASN barcode detection
      PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
      PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE: "true"
      PAPERLESS_CONSUMER_ASN_BARCODE_PREFIX: "ASN"
      PAPERLESS_CONSUMER_BARCODE_SCANNER: "ZXING"
      PAPERLESS_CONSUMER_BARCODE_PAGES: 0
      PAPERLESS_CONSUMER_BARCODE_DPI: 600
      PAPERLESS_CONSUMER_BARCODE_UPSCALE: 1.5
      PAPERLESS_POST_CONSUME_SCRIPT: /usr/src/paperless/scripts/post-consume-asn.py
      # File naming
      PAPERLESS_FILENAME_FORMAT: "{{ correspondent|slugify }}/{{ created_year }}/{{ created }} {{ title|slugify }}"
      PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
      PAPERLESS_FILENAME_DATE_ORDER: "YMD"
      # Performance
      PAPERLESS_TASK_WORKERS: 2
      PAPERLESS_THREADS_PER_WORKER: 2
      PAPERLESS_DEBUG: "false"
      # Proxy
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_USE_X_FORWARD_PORT: "true"
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      # Email (optional)
      PAPERLESS_EMAIL_HOST: ${PAPERLESS_EMAIL_HOST}
      PAPERLESS_EMAIL_PORT: ${PAPERLESS_EMAIL_PORT}
      PAPERLESS_EMAIL_HOST_USER: ${PAPERLESS_EMAIL_HOST_USER}
      PAPERLESS_EMAIL_HOST_PASSWORD: ${PAPERLESS_EMAIL_HOST_PASSWORD}
      PAPERLESS_EMAIL_USE_SSL: ${PAPERLESS_EMAIL_USE_SSL}
      PAPERLESS_EMAIL_FROM: ${PAPERLESS_EMAIL_FROM}
    networks:
      - paperless-net
    deploy:
      resources:
        limits:
          memory: 3G

  # ── Neo4j Graph Database (optional, --profile graph) ────
  neo4j:
    image: neo4j:5-community
    container_name: paperless-neo4j
    profiles:
      - graph
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - ${INSTALL_DIR}/neo4j/data:/data
      - ${INSTALL_DIR}/neo4j/logs:/logs
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - paperless-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Cloudflare Tunnel (optional, --profile tunnel) ──────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: paperless-cloudflared
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - paperless-net
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  paperless-net:
    driver: bridge
